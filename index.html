<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes" />
<title>عزم (AZM) &amp; یورپین رولیٹ کاؤنٹر — ماسٹر والٹ</title>
<style>
  :root {
    --bg-felt: #0b4a2e;
    --bg-felt-dark: #073320;
    --bg-panel: #0f1b16;
    --bg-card: #15261f;
    --gold: #f5c542;
    --gold-soft: rgba(245, 197, 66, 0.22);
    --red-num: #c92a2a;
    --black-num: #1c1f24;
    --green-zero: #16803c;
    --text-main: #f4f7f5;
    --text-muted: #9eb3a8;
    --border-gold: rgba(245, 197, 66, 0.45);
    --zoom: 1;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html {
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  body {
    margin: 0;
    padding: 0 0 90px 0;
    background: radial-gradient(circle at top, #123827 0%, #07140e 100%);
    color: var(--text-main);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Nastaliq Urdu", sans-serif;
    overflow-x: hidden;
    overscroll-behavior-y: contain;
  }

  #app-zoom-wrap {
    transform: scale(var(--zoom));
    transform-origin: top center;
    width: calc(100% / var(--zoom));
    transition: transform 0.15s ease-out;
  }

  .top-bar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(10, 24, 18, 0.94);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border-gold);
    padding: 10px 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .brand-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: 15px;
    color: var(--gold);
  }

  .lang-group {
    display: flex;
    gap: 5px;
  }

  .lang-btn {
    border: 1px solid var(--border-gold);
    background: var(--bg-card);
    color: var(--text-main);
    padding: 4px 9px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 600;
  }

  .lang-btn.active {
    background: var(--gold);
    color: #0b1712;
  }

  .zoom-controls {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .zoom-btn {
    background: var(--bg-card);
    color: var(--gold);
    border: 1px solid var(--border-gold);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .nav-tabs {
    display: flex;
    gap: 6px;
    padding: 10px 12px 4px;
    overflow-x: auto;
  }

  .tab-btn {
    flex: 1;
    min-width: 96px;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1px solid var(--border-gold);
    background: var(--bg-card);
    color: var(--text-main);
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }

  .tab-btn.active {
    background: linear-gradient(135deg, #f5c542, #d49b1a);
    color: #0a1410;
    border-color: #ffe07d;
  }

  .container {
    max-width: 920px;
    margin: 0 auto;
    padding: 10px 12px;
  }

  .panel {
    display: none;
  }

  .panel.active {
    display: block;
  }

  .wallet-strip {
    background: var(--bg-panel);
    border: 1px solid var(--border-gold);
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 10px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
  }

  .stat-box {
    background: var(--bg-card);
    border-radius: 10px;
    padding: 9px 11px;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 3px;
  }

  .stat-val {
    font-size: 15px;
    font-weight: 800;
    color: var(--gold);
    direction: ltr;
    text-align: start;
  }

  .coin-tray-wrap {
    background: var(--bg-panel);
    border: 1px solid var(--border-gold);
    border-radius: 14px;
    padding: 10px;
    margin-bottom: 10px;
  }

  .coin-tray-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .coin-tray {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 6px 4px 10px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  .chip-item {
    flex: 0 0 auto;
    min-width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 3px dashed #fff3c4;
    background: radial-gradient(circle at 30% 30%, #ffd859, #b87b08);
    color: #111814;
    font-weight: 900;
    font-size: 11px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
    transition: transform 0.14s ease, opacity 0.2s ease;
    direction: ltr;
  }

  .chip-item.selected {
    transform: translateY(-4px) scale(1.08);
    border-style: solid;
    border-color: #ffffff;
    box-shadow: 0 0 0 3px var(--gold), 0 8px 16px rgba(0, 0, 0, 0.6);
  }

  .chip-item.dimmed {
    opacity: 0.35;
  }

  .roulette-board {
    position: relative;
    background: linear-gradient(180deg, var(--bg-felt) 0%, var(--bg-felt-dark) 100%);
    border: 3px solid var(--gold);
    border-radius: 18px;
    padding: 12px;
    box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.55), 0 12px 24px rgba(0, 0, 0, 0.5);
    direction: ltr;
  }

  .top-meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .badge-pill {
    background: rgba(0, 0, 0, 0.42);
    border: 1px solid var(--border-gold);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 700;
  }

  .table-grid-shell {
    position: relative;
    display: grid;
    grid-template-columns: 64px 74px 1fr;
    gap: 6px;
    user-select: none;
  }

  .outside-col {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .dozen-col {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .dozen-box {
    position: relative;
    flex: 1;
    min-height: 112px;
    background: rgba(255, 255, 255, 0.06);
    border: 1.5px solid rgba(245, 197, 66, 0.55);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
    color: #fff5cc;
    cursor: pointer;
    touch-action: pan-y;
  }

  .dozen-zone-strip {
    position: absolute;
    left: 0;
    right: 0;
    height: 33.333%;
    z-index: 2;
  }
  .dozen-zone-strip.top { top: 0; }
  .dozen-zone-strip.mid { top: 33.333%; }
  .dozen-zone-strip.bot { top: 66.666%; }

  .outside-box {
    position: relative;
    flex: 1;
    min-height: 54px;
    border-radius: 10px;
    border: 1.5px solid rgba(245, 197, 66, 0.55);
    background: rgba(0, 0, 0, 0.28);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 12px;
    cursor: pointer;
    touch-action: pan-y;
  }

  .outside-box.red-box { background: rgba(201, 42, 42, 0.85); }
  .outside-box.black-box { background: rgba(24, 27, 32, 0.92); }

  .numbers-area {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .zero-cell {
    position: relative;
    height: 54px;
    background: var(--green-zero);
    border: 1.5px solid var(--gold);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 18px;
    cursor: pointer;
    touch-action: pan-y;
  }

  .nums-3x12 {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
  }

  .num-cell {
    position: relative;
    height: 54px;
    border-radius: 9px;
    border: 1.5px solid rgba(255, 255, 255, 0.22);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 16px;
    cursor: pointer;
    touch-action: pan-y;
  }

  .num-cell.red { background: var(--red-num); }
  .num-cell.black { background: var(--black-num); }
  .num-cell.last-hit {
    box-shadow: 0 0 0 3px var(--gold);
    border-color: #fff;
  }

  .hit-count {
    font-size: 10px;
    background: rgba(0, 0, 0, 0.45);
    padding: 1px 6px;
    border-radius: 999px;
    margin-top: 2px;
    color: #ffe89e;
  }

  .hotspot-invisible {
    position: absolute;
    z-index: 6;
    background: transparent;
    border: none;
    pointer-events: auto;
    touch-action: pan-y;
  }

  .hotspot-invisible.drag-target-active {
    background: rgba(245, 197, 66, 0.28);
    border-radius: 50%;
  }

  .placed-chip {
    position: absolute;
    bottom: 4px;
    right: 4px;
    z-index: 12;
    min-width: 28px;
    height: 28px;
    padding: 0 5px;
    border-radius: 999px;
    background: radial-gradient(circle at 30% 30%, #ffe066, #c98608);
    color: #101612;
    border: 2px solid #ffffff;
    font-size: 10px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.65);
    cursor: grab;
    touch-action: none;
    direction: ltr;
  }

  .placed-chip.dragging-source {
    opacity: 0.35;
  }

  #floating-drag-coin {
    position: fixed;
    z-index: 9999;
    pointer-events: none;
    display: none;
    min-width: 44px;
    height: 44px;
    padding: 0 8px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffe77a, #b87504);
    color
